# The macOS app (`pnpm dist:mac`, the manual's "On macOS"). Paths are from app/.
appId: io.github.luisg0nc.torno
productName: torno
directories:
  output: dist

# What runs in the app: the build (main, preload, renderer, and the export viewer `out/viewer/viewer.js`, which
# `src/main/export/html.ts` reads), without source maps. Dependencies of main and preload are added by
# electron-builder from package.json.
files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true
# node-pty's `.node` files and `spawn-helper` cannot run from inside an asar. node-pty looks for `spawn-helper` in
# `app.asar.unpacked` itself.
asarUnpack:
  - '**/node_modules/node-pty/**'

# Beside the asar, in `Resources/` (`src/main/paths.ts`, `src/main/example.ts`). Never `.venv`, `tests`, caches.
extraResources:
  - from: ../kernel
    to: kernel
    filter:
      - pyproject.toml
      - uv.lock
      - src/**
      - '!**/__pycache__'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: resources/agent-plugin
    to: agent-plugin
  - from: resources/icon.png
    to: icon.png
  # The example of the first screen: `EXAMPLE_OBJECTS` of src/main/example.ts and what they read (`gauge`'s variant.txt).
  - from: ../kernel/tests/fixtures/ws
    to: example
    filter:
      - bracket/**
      - gauge/**
      - hollow/**
      - measures/**
      - '!**/__pycache__'
      - '!**/__pycache__/**'
      - '!**/*.pyc'

mac:
  target: [dir, zip]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # Signed ad hoc: an unsigned arm64 binary is killed at once. No Developer ID, no hardened runtime, no notarization.
  identity: '-'
  hardenedRuntime: false
  notarize: false

# Linux (`pnpm dist:linux`): an AppImage and a tar.gz of the same folder, in `app/dist/`. Not signed, and not
# installed by torno: `scripts/torno --install-desktop` is for a clone. `pnpm pack:check` builds the folder alone
# (`--linux dir`), the files the tar.gz holds, to check the packaging with `e2e/packaged.spec.ts`. No Windows build.
linux:
  target: [AppImage, tar.gz]
  category: Development
  icon: resources/icon.png
  maintainer: luisg0nc
  synopsis: A workbench for making CAD parts with an AI coding agent
