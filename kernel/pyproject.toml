[project]
name = "torno-kernel"
version = "0.1.0"
description = "Loads build123d models and serves their geometry to the torno app"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "ocp-tessellate>=3.5,<4",
    "numpy",
]

[project.optional-dependencies]
# What reading a scan needs. Asked for by the import process only (app/src/main/scans/importer.ts):
# the kernel itself starts without them, so no build waits on a library no build uses.
scans = [
    "trimesh>=5,<6",
    "pillow",
]

[dependency-groups]
dev = [
    "build123d==0.13.0",
    "pytest",
    "trimesh>=5,<6",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torno_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
