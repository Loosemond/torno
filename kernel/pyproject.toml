[project]
name = "torno-kernel"
version = "0.1.0"
description = "Loads build123d models and serves their geometry to the torno app"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ocp-tessellate>=3.5,<4",
    "numpy",
]

[dependency-groups]
dev = [
    "build123d==0.13.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torno_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
