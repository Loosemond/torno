<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- torno is Portuguese for a bench vise: one seen from the side, its jaws and slide holding a part in the accent
       (layout blue, painted on steel before it is scribed), its screw and handle, its base; on the paper grey.
       Every edge is on an even unit, so that it is drawn to the pixel at 32 px. torno-16.svg is the drawing for
       16 px, app/resources/icon.png the window's, made from this by `resvg -w 512 -h 512`; ui/Logo.tsx draws both. -->
