name: CI

# The suites that need no display: the app's unit tests, its typecheck, the kernel's own tests, and the app
# against the real kernel with the stand-in agent. The Playwright suite drives Electron in a hidden window on a
# desktop (app/e2e/CLAUDE.md) and is run by hand before a release. The packaged apps are built and started in a hidden
# window by the Linux and macOS jobs at the end (`TORNO_TEST=1`; on Linux under xvfb).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (unit, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app typecheck
      - run: pnpm test

  kernel:
    name: Kernel (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: uv sync --frozen
        working-directory: kernel
      - run: uv run --no-sync pytest -q
        working-directory: kernel

  integration:
    name: App against the kernel
    runs-on: ubuntu-latest
    needs: [app, kernel]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: kernel
      - run: pnpm test:kernel

  # The Linux package: the AppImage and the tar.gz of `pnpm dist:linux`, and the packaged app started from the
  # folder `pack` makes, in a hidden window (TORNO_TEST=1) on a virtual display.
  linux-package:
    name: Linux package
    runs-on: ubuntu-latest
    needs: [app, kernel]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm dist:linux
      - run: xvfb-run -a pnpm -C app exec playwright test e2e/packaged.spec.ts
        env:
          TORNO_PACKAGED: ${{ github.workspace }}/app/dist/linux-unpacked/torno-app
      - uses: actions/upload-artifact@v4
        with:
          name: torno-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.tar.gz
          retention-days: 7

  # The macOS app: the suites that touch the platform, `pnpm dist:mac`, and the packaged app started in a hidden
  # window. The zip is uploaded for a look by hand; it is signed ad hoc (quarantined once downloaded).
  macos:
    name: macOS
    runs-on: macos-latest
    needs: [app, kernel]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: kernel
      - run: pnpm -C app typecheck
      - run: pnpm test
      - run: pnpm test:kernel
      - run: pnpm dist:mac
      - run: pnpm -C app exec playwright test e2e/packaged.spec.ts
        env:
          TORNO_PACKAGED: ${{ github.workspace }}/app/dist/mac-arm64/torno.app/Contents/MacOS/torno
      - uses: actions/upload-artifact@v4
        with:
          name: torno-macos
          path: app/dist/*.zip
          retention-days: 7
