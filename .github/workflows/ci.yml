name: CI

# The suites that need no display: the app's unit tests, its typecheck, the kernel's own tests, and the app
# against the real kernel with the stand-in agent. The Playwright suite drives Electron in a hidden window on a
# desktop (.claude/rules/e2e-hidden-window.md) and is run by hand before a release. The Linux package is built and started in a hidden
# window at the end (`TORNO_TEST=1`, under xvfb). macOS is apart, in macos.yml. A change of only the site or the docs
# runs none of the suites: `changes` says so, and the jobs it gates are skipped (which a required check accepts).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is there a changed file that is not the site's or the docs'? Any doubt (no base, a failed diff) says yes.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF...HEAD"
          else
            range="$BEFORE..$SHA"
            case "$BEFORE" in 0000000*) range= ;; esac
          fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range") && [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/manual.md) code=true ;;
                site/*|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|.github/workflows/pages.yml|CITATION.cff|LICENSE) ;;
                */*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  app:
    name: App (unit, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app typecheck
      - run: pnpm test

  kernel:
    name: Kernel (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: uv sync --frozen
        working-directory: kernel
      - run: uv run --no-sync pytest -q
        working-directory: kernel

  integration:
    name: App against the kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, app, kernel]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: kernel
      - run: pnpm test:kernel

  # The Linux package: the AppImage and the tar.gz of `pnpm dist:linux`, and the packaged app started from the
  # folder `pack` makes, in a hidden window (TORNO_TEST=1) on a virtual display.
  linux-package:
    name: Linux package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, app, kernel]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: kernel/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm dist:linux
      - run: xvfb-run -a pnpm -C app exec playwright test e2e/packaged.spec.ts
        env:
          TORNO_PACKAGED: ${{ github.workspace }}/app/dist/linux-unpacked/torno-app
          # No GPU on the runner: WebGL is drawn in software, or the window says the 3D view could not start.
          TORNO_E2E_SOFTWARE_GL: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: torno-linux-test-results
          path: app/e2e/.results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: torno-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.tar.gz
          retention-days: 7
