name: Feature request
description: Something you wish torno did
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        torno is deliberately not a modeller: no sketcher, no feature tree, no editing solids by hand. The model
        is the Python file, and changes that keep it that way fit best.
  - type: textarea
    id: moment
    attributes:
      label: The moment you wished for it
      description: What you were doing and what got in the way.
    validations:
      required: true
  - type: textarea
    id: instead
    attributes:
      label: What you did instead
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: And how it keeps the model as the Python file.
